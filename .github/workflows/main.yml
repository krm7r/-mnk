name: Ultimate Web Scraper - Remote Crawler

on:
  workflow_dispatch:
    inputs:
      site_1:
        description: 'رابط الموقع الأول (مطلوب)'
        required: true
        type: string
      site_2:
        description: 'رابط الموقع الثاني (اختياري)'
        required: false
        type: string
      max_pages:
        description: 'أقصى عدد صفحات لكل موقع (1-5000)'
        required: false
        default: '5000'
        type: string
      concurrency:
        description: 'أقصى عدد صفحات متصفح تعمل معًا (1-10)'
        required: false
        default: '10'
        type: string
      wait_ms:
        description: 'وقت الانتظار بعد تحميل الصفحة بالمللي ثانية'
        required: false
        default: '2500'
        type: string
      download_assets:
        description: 'تنزيل CSS و JavaScript'
        required: false
        default: true
        type: boolean

jobs:
  crawl:
    name: Crawl websites
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SITE_1: ${{ inputs.site_1 }}
      SITE_2: ${{ inputs.site_2 }}
      MAX_PAGES: ${{ inputs.max_pages }}
      CONCURRENCY: ${{ inputs.concurrency }}
      WAIT_MS: ${{ inputs.wait_ms }}
      DOWNLOAD_ASSETS: ${{ inputs.download_assets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Show job settings
        run: |
          echo "Site 1: $SITE_1"
          echo "Site 2: ${SITE_2:-<none>}"
          echo "Max pages/site: $MAX_PAGES"
          echo "Global concurrency: $CONCURRENCY"
          echo "Download assets: $DOWNLOAD_ASSETS"

      - name: Run crawler
        run: npm run crawl:workflow

      - name: Upload ZIP result
        uses: actions/upload-artifact@v4
        with:
          name: website-scrape-${{ github.run_id }}
          path: output/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: website-scrape-report-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn
          retention-days: 7
